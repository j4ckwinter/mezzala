[project]
name = "mezzala"
version = "0.3.2"
description = "A Football Manager 27 MCP server that answers transfer questions from your own save."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fmsave>=0.14.3,<0.15",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[project.scripts]
mezzala = "mezzala.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
